<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book {{ product.name|default:"Product" }}</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        .btn { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
        .btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Book Item: {{ product.name }}</h2>
        
        {% if product.rental_amount %}
            <p><strong>Daily Rate:</strong> ₹{{ product.rental_amount }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            {% if form %}
                <!-- Render standard Django Form if passed from views.py -->
                {{ form.as_p }}
            {% else %}
                <!-- Manual fallback input fields if not using a ModelForm -->
                <div class="form-group">
                    <label for="start_date">Start Date</label>
                    <input type="date" id="start_date" name="start_date" required>
                </div>

                <div class="form-group">
                    <label for="end_date">End Date</label>
                    <input type="date" id="end_date" name="end_date" required>
                </div>
            {% endif %}

            <button type="submit" class="btn">Confirm Booking</button>
        </form>
    </div>

</body>
</html>
